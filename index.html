<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de Pourboire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    .card {
      background: #16213e;
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #e94560;
      margin-bottom: 1.8rem;
      letter-spacing: 0.02em;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a0a0b0;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #e94560;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }

    .tip-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .tip-btn {
      padding: 0.6rem 0;
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .tip-btn:hover { background: #1a4a8a; }

    .tip-btn.active {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
    }

    .custom-tip-wrap {
      position: relative;
    }

    .custom-tip-wrap input {
      padding-right: 2rem;
    }

    .custom-tip-wrap::after {
      content: '%';
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a0b0;
      font-size: 1rem;
      pointer-events: none;
    }

    .divider {
      height: 1px;
      background: #0f3460;
      margin: 1.6rem 0;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-label {
      font-size: 0.9rem;
      color: #a0a0b0;
    }

    .result-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .result-row.total .result-label {
      font-size: 1rem;
      color: #e94560;
      font-weight: 700;
    }

    .result-row.total .result-value {
      font-size: 1.5rem;
      color: #e94560;
    }

    .per-person {
      background: #0f3460;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-top: 0.5rem;
    }

    .per-person .result-value { color: #4ecdc4; }
    .per-person .result-label { color: #4ecdc4; opacity: 0.8; }

    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 1.8rem;
      padding: 0.85rem;
      background: transparent;
      border: 2px solid #e94560;
      border-radius: 10px;
      color: #e94560;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .reset-btn:hover { background: #e94560; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculateur de Pourboire</h1>

    <div class="field">
      <label>Montant avant taxes ($)</label>
      <input type="number" id="subtotal" min="0" step="0.01" placeholder="0.00" />
    </div>

    <div class="field">
      <label>Pourcentage de pourboire</label>
      <div class="tip-buttons">
        <button class="tip-btn" data-tip="10">10%</button>
        <button class="tip-btn" data-tip="15">15%</button>
        <button class="tip-btn active" data-tip="18">18%</button>
        <button class="tip-btn" data-tip="20">20%</button>
        <button class="tip-btn" data-tip="25">25%</button>
        <button class="tip-btn" data-tip="30">30%</button>
      </div>
      <div class="custom-tip-wrap field" style="margin-bottom:0">
        <label>Personnalisé</label>
        <input type="number" id="custom-tip" min="0" max="100" step="0.5" placeholder="Autre %" />
      </div>
    </div>

    <div class="field">
      <label>Nombre de personnes</label>
      <input type="number" id="people" min="1" step="1" value="1" />
    </div>

    <div class="divider"></div>

    <div class="results">
      <div class="result-row">
        <span class="result-label">Montant avant taxes</span>
        <span class="result-value" id="res-subtotal">$0.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">Pourboire (<span id="res-pct">18</span>%)</span>
        <span class="result-value" id="res-tip">$0.00</span>
      </div>
      <div class="result-row total">
        <span class="result-label">Total (avant taxes + pourboire)</span>
        <span class="result-value" id="res-total">$0.00</span>
      </div>
      <div class="per-person result-row">
        <span class="result-label">Pourboire par personne</span>
        <span class="result-value" id="res-per-person">$0.00</span>
      </div>
    </div>

    <button class="reset-btn" id="reset-btn">Réinitialiser</button>
  </div>

  <script>
    const subtotalInput = document.getElementById('subtotal');
    const customTipInput = document.getElementById('custom-tip');
    const peopleInput = document.getElementById('people');
    const tipButtons = document.querySelectorAll('.tip-btn');

    const resSubtotal = document.getElementById('res-subtotal');
    const resTip = document.getElementById('res-tip');
    const resTotal = document.getElementById('res-total');
    const resPerPerson = document.getElementById('res-per-person');
    const resPct = document.getElementById('res-pct');

    let selectedTip = 18;

    function fmt(n) {
      return '$' + n.toFixed(2);
    }

    function calculate() {
      const subtotal = Math.max(0, parseFloat(subtotalInput.value) || 0);
      const people = Math.max(1, parseInt(peopleInput.value) || 1);
      const tip = subtotal * (selectedTip / 100);
      const total = subtotal + tip;

      resSubtotal.textContent = fmt(subtotal);
      resTip.textContent = fmt(tip);
      resTotal.textContent = fmt(total);
      resPerPerson.textContent = fmt(tip / people);
      resPct.textContent = selectedTip % 1 === 0 ? selectedTip : selectedTip.toFixed(1);
    }

    tipButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tipButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        customTipInput.value = '';
        selectedTip = parseFloat(btn.dataset.tip);
        calculate();
      });
    });

    customTipInput.addEventListener('input', () => {
      const val = parseFloat(customTipInput.value);
      if (!isNaN(val) && val >= 0) {
        tipButtons.forEach(b => b.classList.remove('active'));
        selectedTip = val;
        calculate();
      }
    });

    subtotalInput.addEventListener('input', calculate);
    peopleInput.addEventListener('input', calculate);

    document.getElementById('reset-btn').addEventListener('click', () => {
      subtotalInput.value = '';
      customTipInput.value = '';
      peopleInput.value = '1';
      tipButtons.forEach(b => b.classList.remove('active'));
      document.querySelector('[data-tip="18"]').classList.add('active');
      selectedTip = 18;
      calculate();
    });

    calculate();
  </script>
</body>
</html>
